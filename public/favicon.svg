<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="35%" stop-color="#635bff" />
      <stop offset="70%" stop-color="#7a73ff" />
      <stop offset="100%" stop-color="#ff6080" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#635bff" />
      <stop offset="100%" stop-color="#ff6080" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sphere/Ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#orbitGrad)" stroke-width="7" fill="none" opacity="0.95" stroke-linecap="round" />

  <!-- Orbital Ellipse Ring -->
  <ellipse cx="50" cy="50" rx="44" ry="18" stroke="url(#orbitGrad)" stroke-width="6" fill="none" transform="rotate(-30 50 50)" stroke-linecap="round" />

  <!-- Center Pulse / Scoring Wave -->
  <path d="M 24 50 L 38 50 L 44 65 L 56 32 L 63 56 L 68 50 L 76 50" 
        stroke="url(#pulseGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>
